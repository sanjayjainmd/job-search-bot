name: discover

on:
  schedule:
    # 13:00 UTC ~= 06:00 Pacific. Cron is always UTC.
    - cron: "0 13 * * *"
  workflow_dispatch:        # gives you (and any collaborator) a "Run workflow" button

# Needed so the run can commit jobs.db and board.html back to this repo.
permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

env:
  # Public repo that hosts the board via GitHub Pages. Only board.html is
  # copied there; the database, company list and config stay in this private repo.
  BOARD_REPO: job-board

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-core.txt

      - name: Run discover
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DRY_RUN: "false"
          # State now lives in the repo, not a cache. If jobs.db is missing the
          # run says so in the digest, rather than looking like a duplicate flood.
          STATE_RESTORED: ${{ hashFiles('jobs.db') != '' }}
        run: python run_discover.py

      - name: Report dedup state
        if: always()
        run: python run_discover.py --stats

      # State is committed rather than cached: durable, versioned, and you can
      # git pull to inspect the real history locally.
      - name: Commit state
        if: always()
        run: |
          git config user.name "job-search-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.db board.html
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "State: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      # Copies ONLY board.html to the public repo that serves GitHub Pages.
      # Skips silently until BOARD_DEPLOY_TOKEN exists, so the run never breaks
      # just because publishing is not set up yet.
      - name: Publish board to GitHub Pages
        if: always()
        env:
          DEPLOY_TOKEN: ${{ secrets.BOARD_DEPLOY_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "BOARD_DEPLOY_TOKEN not set - skipping publish."
            exit 0
          fi
          if [ ! -f board.html ]; then
            echo "No board.html to publish."
            exit 0
          fi
          rm -rf /tmp/board
          git clone --quiet --depth 1 \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/${OWNER}/${BOARD_REPO}.git" \
            /tmp/board
          # index.html so the bare Pages URL works with no path.
          cp board.html /tmp/board/index.html
          cd /tmp/board
          git config user.name "job-search-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Board unchanged."
          else
            git commit --quiet -m "Board: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push --quiet
            echo "Published to https://${OWNER}.github.io/${BOARD_REPO}/"
          fi
