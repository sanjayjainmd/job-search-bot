# Target companies for direct ATS polling — the primary, most reliable source.
#
# ats: greenhouse | lever | ashby
# slug: the company's board identifier, e.g.
#   greenhouse -> https://boards-api.greenhouse.io/v1/boards/<slug>/jobs
#   lever      -> https://api.lever.co/v0/postings/<slug>
#   ashby      -> https://api.ashbyhq.com/posting-api/job-board/<slug>
#
# Every entry below was verified live on 2026-08-23 (posting counts at the time
# are noted). Re-check any time with:
#   py run_discover.py --verify
#
# Optional: add `size: small` or `size: large` to any entry to override the
# automatic size guess (which uses open-role count). Size decides whether
# senior-sounding titles like "Head of Finance" are treated as a first finance
# hire or as a big-company executive.
#
# Growing this list is the highest-leverage maintenance task in the whole bot.

