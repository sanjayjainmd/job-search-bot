# Everything person-specific lives here. No code changes needed to retarget.

profile:
  name: "Financial analyst"
  summary: >
    Financial analyst with private equity experience, targeting finance roles at
    AI inference / AI infrastructure startups. Strong on financial modelling,
    diligence, unit economics and capital allocation. Interested in roles where
    finance work touches compute spend, GPU/inference cost, pricing and margin
    structure. Open to being an early finance hire at a small company.
  seniority: "Analyst through Manager level. Not VP or C-suite."

targets:
  # Used to build search queries and to sanity-check job locations.
  # Matched as substrings against the posting's location text. Companies write
  # the Bay Area many different ways ("Sunnyvale Office", "San Jose Office
  # (First St)"), so list the cities, not just the metro name.
  locations:
    - "San Francisco"
    - "San Francisco Bay Area"
    - "Bay Area"
    - "San Jose"
    - "Sunnyvale"
    - "Palo Alto"
    - "Mountain View"
    - "Menlo Park"
    - "Redwood City"
    - "Santa Clara"
    - "San Mateo"
    - "Burlingame"
    - "Cupertino"
    - "Fremont"
    - "Oakland"
    - "Berkeley"
    - "Emeryville"
  remote_ok: true          # set false to require Bay Area presence
  # true = drop anything outside the list above (blank locations still pass,
  # so the LLM can judge them rather than losing them silently).
  location_is_hard_filter: true

  # A company with at most this many open roles counts as small. 40 is roughly
  # a sub-150-person company. Raise it to be more permissive about senior
  # titles; lower it to push more of them into the Worth a look section.
  small_company_max_postings: 40
  # jobspy results carry no company size, so decide what to do with them.
  treat_unknown_size_as_small: true

filters:
  # Cheap keyword gate applied BEFORE the LLM, so scoring stays cheap.
  # A job must match at least one include term in its title.
  title_include:
    - finance
    - financial
    - fp&a
    - fpa
    - strategic finance
    - bizops
    - business operations
    - corporate development
    - corp dev
    - finops
    - revenue operations
    - treasury
    - controller
    - accounting
    - accountant
    - pricing
    - business analyst
    - investment
  # Any of these in the title drops the job outright.
  title_exclude:
    - engineer
    - engineering
    - developer
    - scientist
    - designer
    - recruiter
    - account executive
    - sales development
    - marketing
    - customer support
    - customer success
    - intern
    - internship
    - data analyst
    - security
    # NOTE: 'manager' is deliberately NOT excluded - the profile is
    # "Analyst through Manager level".

  # Senior-sounding titles are NEVER dropped - dropping loses jobs silently.
  # At a small company these usually mean "first finance hire", so they are
  # treated as a normal match. At a large company they go into the digest's
  # "Worth a look" section instead. Size comes from targets.* below, or from
  # an explicit `size:` on the company in companies.yaml.
  title_stretch:
    - senior
    - sr
    - principal
    - lead
    - director
    - head
    - vp
    - vice president
    - chief
    - executive

scoring:
  enabled: true
  min_score: 60           # jobs scoring below this are stored but not sent
  stretch_min_score: 70   # 'Worth a look' items must clear a higher bar
  model_max_tokens: 400

boards:
  # Passed to jobspy on the local runner.
  search_terms:
    - 'financial analyst AI infrastructure'
    - '"strategic finance" startup San Francisco'
    - 'FP&A analyst AI startup'
    - 'finance analyst GPU OR inference OR compute'
  sites: ["linkedin", "google"]
  results_wanted: 20
  hours_old: 72

canary:
  # Warn if a source returns zero results this many runs in a row while
  # other sources are healthy. Catches silent blocking / dead scrapers.
  zero_streak_warning: 3

delivery:
  # Safety valve for the first run against an empty database, which would
  # otherwise send every historical posting at once. Anything over the cap is
  # left unseen and arrives on the following run, so nothing is lost.
  max_send_per_run: 200   # TEMPORARY for the clean-start run; put back to 25

  # The strongest matches are ALSO sent as individual Telegram messages with a
  # one-tap "Open posting" button and a tap-to-copy opening line. Set
  # highlight_top: 0 to turn this off and keep the digest only.
  # Cap on the 'Worth a look' section so it cannot swamp the digest.
  max_stretch_per_run: 10

  highlight_top: 3
  highlight_min_score: 75

board:
  # Deployment URL of the Vercel status function (see vercel/README.md), e.g.
  #   https://job-board-status.vercel.app/api/status
  # Leave blank and the board is read-only, with status changed via mark.py.
  # Set it and you can tap New / Seen / Applied / Dismissed on the page itself,
  # from a phone or either laptop, with the marks shared between them.
  status_api: "https://job-search-bot-rho.vercel.app/api/status"

discovery:
  # Curated job newsletters, scanned for COMPANY NAMES rather than listings.
  # A listing goes stale in weeks; a company name added to companies.yaml means
  # the ATS poller sees every finance role that company posts from then on.
  # Substack serves full post content at /feed with no auth or paid seat.
  substacks:
    - aioperators        # Chief of Staff / BizOps at AI startups - closest match
    - andrewtanjobs      # weekly curated startup roles
    - alirohdejobs       # Chief of Staff, BizOps, VC
    - nextplayso         # early-stage startup opportunities
    - a16zbuild          # a16z portfolio roles

  # Posts already read are recorded, so a daily scan only pays for new ones.
  # This caps the first scan, which would otherwise read every feed's backlog.
  max_posts_per_run: 15

  # Hard ceiling on additions per run. A prompt change that suddenly matches
  # everything should be visible as a capped, reviewable batch - not 271 rows.
  max_new_per_run: 25

  # Append verified companies to companies.yaml automatically. Only companies
  # with a working public ATS board are ever added, and every addition is a
  # git commit you can read and revert.
  auto_add: true
